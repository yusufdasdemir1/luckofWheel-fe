# Sunucudaki /etc/nginx/sites-enabled/api.conf yerine geçer (Docker'lı yapı).
# Nginx ve Certbot host'ta kalır; konteynerler sadece 127.0.0.1:3000 ve :8000'de dinler.
# Sertifika tek: "api.cevirkazan360.com" (api + kök domain). Certbot yenilemesi değişmez.
#
# Eskiden farklı olanlar:
#   - /static/ alias'ı kalktı: statikleri konteynerdeki whitenoise veriyor.
#   - /public/images/ alias'ı kaldı (video Range desteği için), yol aynı:
#     backend compose'u bu dizini konteynere volume olarak bağlıyor.
#   - API bloğuna X-Forwarded-Proto eklendi (Django SECURE_PROXY_SSL_HEADER için gerekli).
#   - client_max_body_size: fotoğraf yükleme sınırı.

server {
    server_name api.cevirkazan360.com;

    client_max_body_size 6m;

    location /public/images/ {
        alias /home/wheelproject/luckofWheel/public/images/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.cevirkazan360.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.cevirkazan360.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name cevirkazan360.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.cevirkazan360.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.cevirkazan360.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# --- HTTP -> HTTPS (Certbot'un yazdığı blokların aynısı) ---
server {
    if ($host = api.cevirkazan360.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.cevirkazan360.com;
    return 404; # managed by Certbot
}

server {
    if ($host = cevirkazan360.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name cevirkazan360.com;
    return 404; # managed by Certbot
}
