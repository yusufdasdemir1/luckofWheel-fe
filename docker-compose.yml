# Çalıştır: docker compose up -d --build  (değerler proje klasöründeki .env'den otomatik okunur)
# Prod'da aynı .env sunucuda prod değerleriyle doldurulur (şablon: .env.example).
# NEXT_PUBLIC_BASE_URL build sırasında koda gömülür; ortam değişince yeniden derlenir.
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?.env dosyası yok, .env.example'dan kopyalayın}
        API_INTERNAL_URL: ${API_INTERNAL_URL:-}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    image: cevirkazan-fe
    container_name: cevirkazan
    ports:
      # Varsayılan 127.0.0.1: sadece makineden/Nginx'ten erişilir, internete açılmaz.
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-3000}:3000"
    extra_hosts:
      # sunucu tarafı istekleri makinedeki backend'e host.docker.internal ile gider
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
